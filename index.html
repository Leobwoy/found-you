<style>
  :root {

    --green: #39ff14;
    --red: #ff3b3b;
    --amber: #ffd23f;
    --wa: #25d366;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 16px/1.6 'Share Tech Mono', ui-monospace, Menlo, Consolas, "Droid Sans Mono", monospace;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;

    overflow-x: hidden;

  #rain { position: fixed; inset: 0; z-index: 0; opacity: .32; pointer-events: none; }
  /* CRT scanlines */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 2;

  .line { margin: 0 0 .4em; white-space: pre-wrap; word-break: break-word; }
  .line.dim { color: var(--dim); }
  .line.ok { color: var(--green); font-weight: 700; }
  .line.sub { color: var(--dim); margin-top: -.15em; }
  .pre { color: var(--dim); }

  .live { color: var(--amber); font-weight: 700; display: inline-block; min-width: 2ch; text-shadow: 0 0 8px rgba(255,210,63,.4); }
  .cursor::after { content: "\2588"; color: var(--green); margin-left: 2px; animation: blink .9s steps(2, start) infinite; }
  @keyframes blink { to { visibility: hidden; } }
  .dots::after { content: ""; animation: dots 1.2s steps(4, end) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

    0%, 88%, 100% { transform: none; text-shadow: 0 0 14px rgba(255,59,59,.55); }
    90% { transform: translate(2px, -1px); text-shadow: -3px 0 #0ff, 3px 0 #f0f; }
    92% { transform: translate(-2px, 1px); text-shadow: 3px 0 #0ff, -3px 0 #f0f; }
    94% { transform: none; text-shadow: 0 0 14px rgba(255,59,59,.55); }
    96% { transform: translate(1px, 0); text-shadow: -2px 0 #0ff, 2px 0 #f0f; }
  }

  #flash { position: fixed; inset: 0; background: #d6ffe0; opacity: 0; pointer-events: none; z-index: 3; }
  #flash.go { animation: flash .45s ease-out both; }
  @keyframes flash { from { opacity: .85; } to { opacity: 0; } }

  .btn {
    display: block; width: 100%; margin-top: 22px; padding: 14px 16px;
    background: rgba(57,255,20,.04); color: var(--green); border: 1px solid var(--green); border-radius: 4px;
    font: inherit; text-transform: uppercase; letter-spacing: .08em; text-align: left; cursor: pointer; text-decoration: none;
    box-shadow: 0 0 12px rgba(57,255,20,.12), inset 0 0 12px rgba(57,255,20,.05);
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active { background: rgba(57,255,20,.16); }
  .btn.wa { background: var(--wa); border-color: var(--wa); color: #03140a; font-weight: 700; box-shadow: 0 0 14px rgba(37,211,102,.35); }
  .btn.ghost { color: var(--fg); border-color: var(--line); box-shadow: none; }
  .btn.small { display: inline-block; width: auto; margin: 0; padding: 8px 12px; }

  .fade { animation: fade .5s ease-out both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  #dares h2 { font: inherit; color: var(--fg); margin: 26px 0 6px; }
  .dare { display: flex; gap: 12px; padding: 11px 6px; margin: 0 -6px; border-top: 1px dashed var(--line); border-radius: 3px; }

  .dare.off .txt { color: var(--dim); }
  .dare.hit { animation: hit .7s ease-out; }
  @keyframes hit { from { background: rgba(57,255,20,.22); } to { background: transparent; } }
  .linkish { background: none; border: 0; padding: 0; margin-top: 16px; font: inherit; color: var(--dim); text-decoration: underline; cursor: pointer; }

  #end { margin-top: 30px; border-top: 1px solid var(--line); padding-top: 20px; }

<script>
/* ───────────── edit these ───────────── */
const CONFIG = {
  madeBy: 'Yaw',
  whatsappNumber: '',      // your number with country code, digits only, e.g. '233241234567'. Enables the "ask me how" button.
  shareText: 'This page knew my phone model, my battery %, and when I plugged in my charger 😳 Open it and see:',
};
/* ────────────────────────────────────── */

const $ = id => document.getElementById(id);
const log = $('log');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const ua = navigator.userAgent;
const uad = navigator.userAgentData || null;
const isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/.test(ua) || (uad && uad.platform === 'Android');
const isMobile = isIOS || isAndroid || (uad && uad.mobile);

/* tap anywhere = fast-forward the typing */
let skip = false;
document.addEventListener('pointerdown', () => { skip = true; }, { passive: true });

/* ── matrix rain ── */
(function rain() {
  const cv = $('rain'), ctx = cv.getContext('2d');
  const chars = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎ0123456789ABCDEF<>/\\|=+*';
  const fs = 14;
  let W, H, cols, drops;
  function size() { W = cv.width = innerWidth; H = cv.height = innerHeight; cols = Math.ceil(W / fs); drops = Array.from({ length: cols }, () => Math.random() * -H / fs); }
  size();
  addEventListener('resize', size);
  setInterval(() => {
    if (document.hidden || reduced) return;
    ctx.fillStyle = 'rgba(2,4,2,.2)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#1f9a3e'; ctx.font = fs + 'px monospace';
    for (let i = 0; i < cols; i++) {
      ctx.fillText(chars[Math.random() * chars.length | 0], i * fs, drops[i] * fs);
      if (drops[i] * fs > H && Math.random() > 0.97) drops[i] = 0;
      drops[i] += 0.5;
    }
  }, 70);
})();

/* ── typing engine ── */
const GLYPHS = '0123456789ABCDEF#$%&@!?<>[]{}/\\|=+*';
async function scramble(span, text) {           // values "decrypt" into place
  const frames = skip || reduced ? 0 : 7;
  for (let f = 0; f < frames; f++) {
    let s = '';
    for (let i = 0; i < text.length; i++) s += text[i] === ' ' ? ' ' : GLYPHS[Math.random() * GLYPHS.length | 0];
    span.textContent = s;
    await sleep(38);
    if (skip) break;
  }
  span.textContent = text;
}
function logLine(text, cls) {                   // instant line, no typing
  const p = document.createElement('p');
  p.className = 'line' + (cls ? ' ' + cls : '');
  p.textContent = text;
  log.appendChild(p);
  return p;
}
async function typeLine(parts, cls, opts) {
  opts = opts || {};
  const pace = opts.pace || 1;
  const nearBottom = innerHeight + scrollY >= document.body.scrollHeight - 160;
  const p = document.createElement('p');
  p.className = 'line' + (cls ? ' ' + cls : '');
  (opts.target || log).appendChild(p);
  if (opts.prefix !== false) { const pre = document.createElement('span'); pre.className = 'pre'; pre.textContent = '> '; p.appendChild(pre); }
  p.classList.add('cursor');
  for (const part of parts) {
    const obj = typeof part === 'object';
    const text = obj ? part.text : part;
    const span = document.createElement('span');
    if (obj && part.cls) span.className = part.cls;
    if (obj && part.id) span.id = part.id;
    p.appendChild(span);
    if (skip || reduced) { span.textContent = text; continue; }
    if (obj && part.cls === 'v') { await scramble(span, text); continue; }
    // time-based, so if the browser throttles timers (hidden tab, slow phone) the text catches up instead of crawling
    let i = 0, due = performance.now();
    while (i < text.length) {
      const now = performance.now();
      while (i < text.length && due <= now) {
        const ch = text[i++];
        due += (/[.!?—]/.test(ch) ? 110 : /[,;:]/.test(ch) ? 50 : 9 + Math.random() * 12) * pace;
      }
      span.textContent = text.slice(0, i);
      if (skip) { span.textContent = text; break; }
      if (i < text.length) await sleep(Math.max(0, due - performance.now()));
    }
  }
  p.classList.remove('cursor');
  if (nearBottom) window.scrollTo(0, document.body.scrollHeight);
  await sleep(skip || reduced ? 0 : (opts.gap || 200));
}

/* ── motion (Android: no permission needed; iOS: asked later, as a dare) ── */
const motion = { seen: false, tilt: 0, faceDown: false, sideways: false, shake: false, dirty: false, last: null };
function onMotion(e) {
  const g = e.accelerationIncludingGravity;
  if (!g || g.x == null) return;
  const mag = Math.hypot(g.x, g.y, g.z);
  if (!mag) return;
  motion.seen = true;
  motion.tilt = Math.round(Math.acos(Math.min(1, Math.abs(g.z) / mag)) * 180 / Math.PI); // 0 = flat, 90 = upright
  motion.faceDown = g.z < -3;
  if (Math.abs(g.x) > 7 && Math.abs(g.x) > Math.abs(g.y)) motion.sideways = true;   // hysteresis: only flip when clearly one or the other
  else if (Math.abs(g.y) > 7) motion.sideways = false;
  // shake = big change between consecutive readings (the classic shake.js approach), or a big jolt without gravity
  if (motion.last) {
    const delta = Math.abs(g.x - motion.last.x) + Math.abs(g.y - motion.last.y) + Math.abs(g.z - motion.last.z);
    if (delta > 15) motion.shake = true;
  }
  motion.last = { x: g.x, y: g.y, z: g.z };
  const a = e.acceleration;
  if (a && a.x != null && Math.hypot(a.x, a.y, a.z) > 12) motion.shake = true;
  motion.dirty = true;
}
const needsMotionPermission = typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function';
window.addEventListener('devicemotion', onMotion);   // fires straight away on Android; on iOS only after permission

/* ── data gathering ── */
let ipInflight = false;
async function lookupIP() {
  const sources = [
    ['https://ipwho.is/', j => j && j.success !== false && j.ip && {
      ip: j.ip, city: j.city, region: j.region, country: j.country,
      isp: j.connection && (j.connection.org || j.connection.isp) }],
    ['https://ipapi.co/json/', j => j && !j.error && j.ip && {
      ip: j.ip, city: j.city, region: j.region, country: j.country_name, isp: j.org }],
    ['https://ipinfo.io/json', j => j && j.ip && {
      ip: j.ip, city: j.city, region: j.region, country: j.country, isp: (j.org || '').replace(/^AS\d+\s+/, '') }],
  ];
  ipInflight = true;
  try {
    for (const [url, map] of sources) {
      try {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 2500);
        const r = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
        clearTimeout(t);
        const out = map(await r.json());
        if (out) return out;
      } catch (e) { /* try the next one */ }
    }
    return null;
  } finally { ipInflight = false; }
}

async function gather() {
  const t0 = Date.now();
  const cap = ms => p => Promise.race([p, sleep(ms).then(() => null)]);
  const [hints, battery, geo] = await Promise.all([
    cap(2000)(uad && uad.getHighEntropyValues ? uad.getHighEntropyValues(['model', 'platformVersion', 'platform']).catch(() => null) : null),
    cap(2000)(navigator.getBattery ? navigator.getBattery().catch(() => null) : null),
    cap(4200)(lookupIP()),
  ]);
  const wait = 1100 - (Date.now() - t0);
  if (wait > 0) await sleep(wait);
  return { hints, battery, geo };
}

/* ── device naming ── */
function samsungName(code) {
  const m = /^(?:SAMSUNG[ -])?SM-([AMSGNFTXJ])(\d{3})/i.exec(code);
  if (!m) return null;
  const L = m[1].toUpperCase(), n = m[2], two = n.slice(0, 2), third = n[2];
  const G = 'Samsung Galaxy ';
  if (L === 'A' || L === 'M') return G + L + two + (third === '6' ? ' 5G' : third === '2' ? ' Core' : '');
  if (L === 'S') {
    const gen = { 90: 'S22', 91: 'S23', 92: 'S24', 93: 'S25', 94: 'S26', 71: 'S23 FE', 72: 'S24 FE', 73: 'S25 FE' }[two];
    if (!gen) return G + 'S';
    if (gen.includes('FE')) return G + gen;
    return G + gen + (third === '6' ? '+' : third === '8' ? ' Ultra' : third === '7' ? ' Edge' : '');
  }
  if (L === 'G') {
    const gen = { 99: 'S21', 98: 'S20', 97: 'S10', 96: 'S9', 95: 'S8', 93: 'S7', 92: 'S6', 78: 'S20 FE' }[two];
    if (!gen) return G;
    if (n === '990') return G + 'S21 FE';
    if (n === '970') return G + 'S10e';
    const plus = /^(996|985|986|975|965|955|935|925)$/.test(n), ultra = /^(998|988)$/.test(n);
    return G + gen + (ultra ? ' Ultra' : plus ? '+' : '');
  }
  if (L === 'N') {
    const gen = { 98: 'Note 20', 97: 'Note 10', 96: 'Note 9', 95: 'Note 8' }[two];
    if (!gen) return G + 'Note';
    return G + gen + (/^(985|986)$/.test(n) ? ' Ultra' : /^(975|976)$/.test(n) ? '+' : '');
  }
  if (L === 'F') {
    if (two[0] === '7') return G + ({ 700: 'Z Flip', 707: 'Z Flip 5G', 711: 'Z Flip3', 721: 'Z Flip4', 731: 'Z Flip5', 741: 'Z Flip6', 766: 'Z Flip7' }[n] || 'Z Flip');
    return G + ({ 900: 'Fold', 916: 'Z Fold2', 926: 'Z Fold3', 936: 'Z Fold4', 946: 'Z Fold5', 956: 'Z Fold6', 966: 'Z Fold7' }[n] || 'Z Fold');
  }
  if (L === 'T' || L === 'X') return G + 'Tab';
  if (L === 'J') return G + 'J' + two;
  return null;
}

function deviceName(model) {
  if (!model) return null;
  const m = model.trim();
  let r;
  if (/^(SAMSUNG[ -])?SM-/i.test(m)) return samsungName(m) || 'Samsung (' + m.replace(/^SAMSUNG[ -]/i, '') + ')';
  if (/^Pixel/i.test(m)) return 'Google ' + m;
  if (/^(Redmi|POCO|Mi |Xiaomi)/i.test(m)) return m;
  if (/^(M2\d{3}[0-9A-Z]+|2[2-9]\d{2}[0-9A-Z]{4,})$/.test(m)) return 'Xiaomi / Redmi (' + m + ')';
  if ((r = /^TECNO\s+([A-Z])/i.exec(m))) {
    const series = { K: 'Spark', C: 'Camon', L: 'Pova', A: 'Phantom' }[r[1].toUpperCase()];
    return series ? 'Tecno ' + series + ' (' + m.replace(/^TECNO\s+/i, '') + ')' : 'Tecno (' + m.replace(/^TECNO\s+/i, '') + ')';
  }
  if (/^Infinix/i.test(m)) return 'Infinix (' + m.replace(/^Infinix\s+/i, '') + ')';
  if (/^itel/i.test(m)) return 'itel (' + m.replace(/^itel\s+/i, '') + ')';
  if (/^CPH\d{4}/.test(m)) return 'Oppo or OnePlus (' + m + ')';
  if (/^RMX\d{4}/.test(m)) return 'Realme (' + m + ')';
  if (/^V\d{4}/.test(m)) return 'Vivo (' + m + ')';
  if (/^Nokia/i.test(m)) return m;
  if (/^moto/i.test(m)) return 'Motorola ' + m;
  if (/^(LM-|LG-)/.test(m)) return 'LG (' + m + ')';
  if (/^[A-Z]{3}-[A-Z]{1,3}\d/.test(m)) return 'Huawei (' + m + ')';
  return null;
}

function iphoneInches() {
  const w = Math.min(screen.width, screen.height), h = Math.max(screen.width, screen.height), d = devicePixelRatio;
  const k = w + 'x' + h;
  const t = { '320x568': '4', '375x667': '4.7', '414x736': '5.5', '390x844': '6.1', '428x926': '6.7', '393x852': '6.1',
              '430x932': '6.7', '402x874': '6.3', '440x956': '6.9', '420x912': '6.5' };
  if (k === '414x896') return d >= 3 ? '6.5' : '6.1';
  return t[k] || null;
}

function browserName() {
  if (uad && uad.brands) {
    const b = uad.brands.find(x => !/Chromium|Not/i.test(x.brand));
    if (b) return b.brand + ' ' + b.version;
  }
  const m = /(Firefox|Edg|OPR|SamsungBrowser|Chrome|Safari)\/(\d+)/.exec(ua);
  if (!m) return null;
  return ({ Edg: 'Microsoft Edge', OPR: 'Opera', SamsungBrowser: 'Samsung Internet' }[m[1]] || m[1]) + ' ' + m[2];
}

function describeDevice(h) {
  const model = (h && h.model) || (() => {
    const m = /Android [^;]+; ([^;)]+?)(?: Build|\))/.exec(ua);        // non-reduced user agents still carry the model
    return m && m[1] !== 'K' ? m[1] : null;
  })();
  if (isIOS) {
    const v = /OS (\d+)[_.](\d+)/.exec(ua);
    const os = v ? 'iOS ' + v[1] + '.' + v[2] : null;
    const which = /iPad/.test(ua) || navigator.platform === 'MacIntel' ? 'iPad' : 'iPhone';
    return ["You're on an ", { text: which, cls: 'v' }, os ? [', running ', { text: os, cls: 'v' }, '.'] : ['.']].flat();
  }
  const name = deviceName(model);
  let osv = h && h.platformVersion ? h.platformVersion.split('.')[0] : null;
  if (!osv && !uad) { const m = /Android (\d+)/.exec(ua); osv = m && m[1]; }
  if (isAndroid) {
    if (name) return ["You're on a ", { text: name, cls: 'v' }, osv ? [', running ', { text: 'Android ' + osv, cls: 'v' }, '.'] : ['.']].flat();
    if (model) return ["Your phone's model code is ", { text: model, cls: 'v' }, osv ? [', running ', { text: 'Android ' + osv, cls: 'v' }, '.'] : ['.']].flat();
    if (osv) return ["You're on ", { text: 'Android ' + osv, cls: 'v' }, '.'];
    return null;
  }
  // desktop
  let os = null;
  const plat = (h && h.platform) || navigator.platform || '';
  if (/Win/.test(plat)) os = (h && h.platformVersion && parseInt(h.platformVersion) >= 13) ? 'Windows 11' : 'Windows';
  else if (/Mac/.test(plat)) os = 'macOS';
  else if (/Linux/.test(plat)) os = 'Linux';
  else if (/CrOS|Chrome OS/.test(plat + ua)) os = 'ChromeOS';
  const br = browserName();
  if (!os && !br) return null;
  const parts = ["You're on "];
  if (os) parts.push({ text: os, cls: 'v' });
  if (os && br) parts.push(', using ');
  if (br) parts.push({ text: br, cls: 'v' });
  parts.push('.');
  return parts;
}

/* ── the lines, built only from what was actually measured ── */
function batteryParts(b) {
  const parts = ['Battery at ', { text: Math.round(b.level * 100) + '%', cls: 'v', id: 'batLvl' }, '. ',
                 { text: b.charging ? 'Charging right now.' : 'Not charging.', cls: 'v', id: 'batChg' }];
  if (!b.charging && isFinite(b.dischargingTime) && b.dischargingTime > 0 && b.dischargingTime < 86400) {
    const h = Math.floor(b.dischargingTime / 3600), m = Math.round((b.dischargingTime % 3600) / 60);
    parts.push(' About ', { text: (h ? h + 'h ' : '') + m + 'm', cls: 'v' }, ' until it dies.');
  }
  return parts;
}

function brandName(isp) {
  const aliases = [
    [/scancom|mtn/i, 'MTN'], [/ghana telecom|vodafone ghana|telecel/i, 'Telecel'], [/millicom|tigo|airtel/i, 'AirtelTigo'],
    [/surfline/i, 'Surfline'], [/busy internet/i, 'Busy'], [/safaricom/i, 'Safaricom'], [/glo /i, 'Glo'],
  ];
  for (const [re, name] of aliases) if (re.test(isp)) return name;
  return isp.replace(/\s+(Limited|Ltd\.?|PLC|Inc\.?|LLC|S\.?A\.?)$/i, '');
}

function connType() {
  const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  return c && (c.type === 'wifi' || c.type === 'cellular') ? c.type : null;
}

function buildLines(d) {
  const L = [];
  const dev = describeDevice(d.hints);
  if (dev) L.push({ parts: dev });

  if (d.battery && typeof d.battery.level === 'number') L.push({ parts: batteryParts(d.battery) });

  // Only what the connection reliably tells us: WiFi vs mobile data, the carrier, the country.
  // (No city: mobile networks route everyone through a few gateways, so IP-based city is usually wrong.
  //  No "3G/4G": the browser only estimates connection quality, not the radio.)
  const type = { cellular: 'mobile data', wifi: 'WiFi' }[connType()] || null;
  const isp = d.geo && d.geo.isp ? brandName(d.geo.isp) : null;
  const country = d.geo && d.geo.country ? [', in ', { text: d.geo.country, cls: 'v' }] : [];
  if (type && isp) L.push({ parts: ['On ', { text: type, cls: 'v' }, ' through ', { text: isp, cls: 'v' }, ...country, '.'] });
  else if (isp) L.push({ parts: ['Connected through ', { text: isp, cls: 'v' }, ...country, '.'] });
  else if (type && country.length) L.push({ parts: ['On ', { text: type, cls: 'v' }, ...country, '.'] });
  else if (type) L.push({ parts: ['On ', { text: type, cls: 'v' }, '.'] });
  if (d.geo && d.geo.ip) L.push({ parts: ['IP address ', { text: d.geo.ip, cls: 'v' }], cls: 'sub' });

  const specs = [];
  if (isIOS) { const inch = iphoneInches(); if (inch) specs.push({ text: inch + '-inch screen', cls: 'v' }); }
  else if (isMobile) {
    const w = Math.round(Math.min(screen.width, screen.height) * devicePixelRatio), h = Math.round(Math.max(screen.width, screen.height) * devicePixelRatio);
    if (w && h) specs.push({ text: w + '×' + h + ' screen', cls: 'v' });
  } else if (screen.width) specs.push({ text: screen.width + '×' + screen.height + ' screen', cls: 'v' });
  // (No RAM, language or timezone: the browser rounds RAM, and "American English" / "Africa/Accra" read as wrong even when true.)
  specs.push({ text: matchMedia('(prefers-color-scheme: dark)').matches ? 'Dark mode on' : 'Light mode on', cls: 'v' });
  L.push({ parts: specs.flatMap((s, i) => i ? ['. ', s] : [s]).concat(['.']) });

  if (motion.seen) L.push({ parts: ['Your phone is tilted ', { text: String(motion.tilt), cls: 'live', id: 'tilt' }, '° right now. Move it — I\'ll know.'] });
  return L;
}

/* ── live updates ── */
let lyingSaid = false, faceDownSince = 0;
function startLive(d) {
  setInterval(() => {
    const el = $('tilt');
    if (el && motion.dirty) { el.textContent = motion.tilt; motion.dirty = false; }
    if (el && !lyingSaid) {
      if (motion.faceDown) {
        if (!faceDownSince) faceDownSince = Date.now();
        else if (Date.now() - faceDownSince > 1500) { lyingSaid = true; typeLine(["…and you're lying down, aren't you."], 'sub'); }
      } else faceDownSince = 0;
    }
  }, 120);
  if (d.battery && d.battery.addEventListener) {
    d.battery.addEventListener('levelchange', () => { const e = $('batLvl'); if (e) e.textContent = Math.round(d.battery.level * 100) + '%'; });
    d.battery.addEventListener('chargingchange', () => { const e = $('batChg'); if (e) e.textContent = d.battery.charging ? 'Charging right now.' : 'Not charging.'; });
  }
}

/* ── dares: every one works both ways, and keeps catching every toggle ── */
const dareList = $('dareList');
const dareEls = [];
const quips = ['Told you.', 'Caught that too.', 'Still watching.', 'I can do this all day.', 'Yep.', 'Saw it.'];
let quipN = 0;
let ended = false;
function addDare(text) {
  const el = document.createElement('div');
  el.className = 'dare';
  el.innerHTML = '<span class="mark">[ ]</span><span class="txt"></span>';
  el.querySelector('.txt').textContent = text;
  dareList.appendChild(el);
  dareEls.push(el);
  return el;
}
function catchDare(el, what, next) {
  if (!el.dataset.done) { el.dataset.done = '1'; el.classList.add('done'); el.querySelector('.mark').textContent = '[✓]'; }
  el.querySelector('.txt').textContent = what + ' ' + quips[quipN++ % quips.length] + (next ? ' ' + next : '');
  el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit');
  buzz([70, 40, 120]);
  if (!ended && dareEls.every(x => x.dataset.done)) revealEnd(false);   // all caught → show the ending, but never yank the page
}

function motionDares() {
  let wasSide = motion.sideways;
  const side = addDare(wasSide ? 'Turn your phone upright.' : 'Turn your phone sideways.');
  const shake = addDare('Shake it.');
  motion.shake = false;
  let lastShake = 0;
  setInterval(() => {
    if (motion.sideways !== wasSide) {
      wasSide = motion.sideways;
      catchDare(side, wasSide ? 'Sideways.' : 'Upright.', wasSide ? 'Now back upright.' : 'Sideways again?');
    }
    if (motion.shake) {
      motion.shake = false;
      if (Date.now() - lastShake > 1500) { lastShake = Date.now(); catchDare(shake, 'Felt that.', 'Again. I dare you.'); }
    }
  }, 120);
}

function buildDares(d) {
  const b = d.battery;
  if (b && typeof b.charging === 'boolean' && b.addEventListener && isMobile) {
    let was = b.charging;
    const el = addDare(was ? 'Unplug your charger.' : 'Plug in your charger.');
    b.addEventListener('chargingchange', () => {
      if (b.charging === was) return;
      was = b.charging;
      catchDare(el, was ? 'Charging.' : 'Unplugged.', was ? 'Now unplug it.' : 'Now plug it back in.');
    });
  }

  if (motion.seen) motionDares();
  else if (needsMotionPermission) {
    // iPhones make sites ask before they can feel the phone move. This is the only "Allow" on the page.
    const el = addDare('');
    const btn = document.createElement('button');
    btn.className = 'btn small'; btn.textContent = '[ let me feel your phone ]';
    el.querySelector('.txt').appendChild(btn);
    btn.onclick = async () => {
      let ok = false;
      try { ok = (await DeviceMotionEvent.requestPermission()) === 'granted'; } catch (e) {}
      if (ok) {
        await sleep(600);
        el.remove(); dareEls.splice(dareEls.indexOf(el), 1);
        if (motion.seen) motionDares();
        else { const x = addDare('Hm. Your phone is keeping quiet.'); x.classList.add('off'); x.dataset.done = '1'; }
      } else { el.classList.add('off'); el.dataset.done = '1'; el.querySelector('.txt').textContent = 'You said no. Fair enough.'; }
    };
  }

  {
    const mq = matchMedia('(prefers-color-scheme: dark)');
    let was = mq.matches;
    const el = addDare(was ? 'Switch your phone to light mode.' : 'Switch your phone to dark mode.');
    const check = () => {
      if (mq.matches === was) return;
      was = mq.matches;
      catchDare(el, was ? 'Dark mode.' : 'Light mode.', was ? 'Now back to light.' : 'Now back to dark.');
    };
    if (mq.addEventListener) mq.addEventListener('change', check); else if (mq.addListener) mq.addListener(check);
    setInterval(check, 700);   // some in-app browsers never fire the event
  }

  {
    // WiFi ↔ mobile data. Two detectors: what the phone reports (Android), and the public IP, which changes
    // when you move between the carrier and a WiFi network (works everywhere, incl. iPhone; checked for 90s).
    const c = navigator.connection;
    let type = connType();
    if (type || (d.geo && d.geo.ip)) {
      const el = addDare(type === 'wifi' ? 'Turn your WiFi off.' : 'Connect to WiFi.');
      const gotIt = (nowWifi, viaIP) => catchDare(el,
        nowWifi === null ? 'Your connection just changed.' : nowWifi ? 'You just switched to WiFi.' : 'Back on mobile data.',
        nowWifi === null ? 'Switch it back?' : nowWifi ? 'Now turn it off again.' : 'Now WiFi again.');
      if (c && type) {
        const check = () => { const t = connType(); if (t && t !== type) { type = t; gotIt(t === 'wifi'); } };
        c.addEventListener('change', check);
        setInterval(check, 700);
      }
      if (d.geo && d.geo.ip) {
        let lastIP = d.geo.ip, tries = 0;
        const iv = setInterval(async () => {
          if (++tries > 22) return clearInterval(iv);
          if (ipInflight) return;
          const g = await lookupIP();
          if (g && g.ip && g.ip !== lastIP) {
            lastIP = g.ip;
            const t = connType();
            if (t) type = t;
            gotIt(t ? t === 'wifi' : null, true);
          }
        }, 4000);
      }
    }
  }
  return dareEls.length;
}

const K = t => ({ text: t, cls: 'k' });
const LESSON = [
  { parts: ["Relax. I didn't hack you."], cls: 'lead', gap: 1400 },
  { parts: ["Every website you open can see all of this the second it loads. Google. That betting site. That link your uncle forwarded. All of them."], gap: 1200 },
  { parts: ["What none of them can see: ", K('your name'), ', ', K('your number'), ', ', K('your contacts'), ', ', K('your photos'), ', ', K('your WhatsApp'), '.'], gap: 1200 },
  { parts: ["Your exact location? Only if you tap ", K('"Allow"'), ". So only tap it for apps that need it — maps, Bolt, Uber."], gap: 1400 },
  { parts: ["Now, since you're here — a few things that actually keep you safe. Small small."], gap: 1400 },
  { parts: ["1. WhatsApp will send you a ", K('6-digit code'), ". Never give it to anyone. Not \"WhatsApp support\", not \"MTN\", not your cousin. ", K('That code IS your account.')], cls: 'tip', gap: 1600 },
  { parts: ["2. Lock it properly: WhatsApp → Settings → Account → ", K('Two-step verification'), ". Thirty seconds. Stops almost every hijack."], cls: 'tip', gap: 1600 },
  { parts: ["3. MTN, Telecel and AirtelTigo will ", K('never'), " call to ask for your MoMo PIN. Anyone who asks is a thief. Hang up."], cls: 'tip', gap: 1600 },
  { parts: ["4. \"I sent you money by mistake, please send it back\" — check your balance first. Nothing came in. ", K("It's a scam."), ""], cls: 'tip', gap: 1600 },
  { parts: ["5. One password per app, and make it a ", K('sentence'), ". \"MyGrandmaSellsKenkeyAtMarketCircle\" beats \"Kofi2024\". Let your phone remember them."], cls: 'tip', gap: 1600 },
  { parts: ["6. \"Congratulations, you've won…\" — you haven't. Anything that needs a \"small fee\" to release money is a scam. ", K('Every single time.')], cls: 'tip', gap: 1600 },
  { parts: ["7. Update your phone when it asks. Boring, I know. Half of hacking is just old software."], cls: 'tip', gap: 1800 },
  { parts: ["That's it. Nothing here was saved. Close this and it's gone."], gap: 1400 },
  { parts: ["Now send it to someone who'd panic 😈"], cls: 'lead', gap: 500 },
];
async function revealEnd(scroll) {
  if (ended) return;
  ended = true;
  const end = $('end');
  end.hidden = false;
  skip = false;                                   // the tap that got us here shouldn't fast-forward the lesson
  if (scroll) { end.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' }); await sleep(600); }
  const target = $('endLog');
  for (const l of LESSON) await typeLine(l.parts, 'edu' + (l.cls ? ' ' + l.cls : ''), { target, pace: 1.5, gap: l.gap });
  $('endActions').hidden = false;
}

/* ── share ── */
function setupShare() {
  const url = location.origin + location.pathname;
  $('waShare').href = 'https://wa.me/?text=' + encodeURIComponent(CONFIG.shareText + '\n' + url);
  const other = $('otherShare');
  if (navigator.share) other.textContent = '> Share another way';
  other.onclick = async () => {
    try {
      if (navigator.share) await navigator.share({ title: document.title, text: CONFIG.shareText, url });
      else { await navigator.clipboard.writeText(url); other.textContent = '> Copied. Now paste it somewhere evil.'; }
    } catch (e) {
      try { await navigator.clipboard.writeText(url); other.textContent = '> Copied. Now paste it somewhere evil.'; } catch (e2) { prompt('Copy this link:', url); }
    }
  };
  const foot = $('foot');
  foot.textContent = 'Built by ' + CONFIG.madeBy + '. ';
  if (CONFIG.whatsappNumber) {
    const a = document.createElement('a');
    a.href = 'https://wa.me/' + CONFIG.whatsappNumber.replace(/\D/g, '') + '?text=' + encodeURIComponent('How did you do that?? 😳');
    a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Ask me how →';
    foot.appendChild(a);
  }
}

/* ── boot sequence: narrates what the page is actually doing ── */
async function boot(d) {
  const conn = $('conn');
  conn.classList.remove('cursor');
  conn.textContent = '> connection established';
  await sleep(skip ? 0 : 160);

  const bar = logLine('> pulling device fingerprint ', 'dim');
  const b = document.createElement('span');
  bar.appendChild(b);
  const W = 12;
  for (let i = 0; i <= W && !skip && !reduced; i++) {
    b.textContent = '[' + '█'.repeat(i) + '░'.repeat(W - i) + '] ' + Math.round(i / W * 100) + '%';
    await sleep(45);
  }
  b.textContent = '[' + '█'.repeat(W) + '] 100%';

  const sensors = [];
  if (d.battery) sensors.push('battery');
  if (motion.seen) sensors.push('motion');
  if (connType() || d.geo) sensors.push('network');
  logLine('> sensors online: ' + (sensors.length ? sensors.join(' · ') : 'none. you hide well.'), 'dim');
  await sleep(skip ? 0 : 140);
  if (d.geo && d.geo.ip) { logLine('> resolving ' + d.geo.ip, 'dim'); await sleep(skip ? 0 : 140); }
  logLine('> access granted', 'ok');
  await sleep(skip ? 0 : 420);
}

/* ── main ── */
async function run() {
  setupShare();
  const d = await gather();
  await boot(d);

  if (!reduced) $('flash').classList.add('go');
  await typeLine(['FOUND YOU.'], 'found', { prefix: false });

  const lines = buildLines(d);
  if (!lines.length) await typeLine(["Your browser is hiding you well. Respect."], 'dim');
  for (const l of lines) await typeLine(l.parts, l.cls);
  startLive(d);

  await sleep(skip ? 0 : 400);
  const doubt = $('doubt');
  doubt.hidden = false;
  doubt.onclick = () => {
    buzz([120, 60, 120, 60, 320]);
    doubt.hidden = true;
    const n = buildDares(d);
    if (n) { $('dares').hidden = false; $('believe').onclick = () => revealEnd(true); }
    else revealEnd(true);
  };
}
run();
</script>
